services:
  cloudflared:

    cap_drop:
      - "AUDIT_CONTROL"
      - "BLOCK_SUSPEND"
      - "DAC_READ_SEARCH"
      - "IPC_LOCK"
      - "IPC_OWNER"
      - "LEASE"
      - "LINUX_IMMUTABLE"
      - "MAC_ADMIN"
      - "MAC_OVERRIDE"
      - "NET_ADMIN"
      - "NET_BROADCAST"
      - "SYSLOG"
      - "SYS_ADMIN"
      - "SYS_BOOT"
      - "SYS_MODULE"
      - "SYS_NICE"
      - "SYS_PACCT"
      - "SYS_PTRACE"
      - "SYS_RAWIO"
      - "SYS_RESOURCE"
      - "SYS_TIME"
      - "SYS_TTY_CONFIG"
      - "WAKE_ALARM"

    command:
      - "tunnel"
      - "--no-autoupdate"
      - "run"
      - "--token"
      - "${CLOUDFLARE_TOKEN}"

    container_name: "cloudflared"

    entrypoint:
      - "cloudflared"
      - "--no-autoupdate"

    environment:
      - "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      - "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt"

    hostname: "bcc797261fe8"

    image: "cloudflare/cloudflared:latest"

    ipc: "private"

    labels:
      CI_BUILD_DATE: "2026-01-27 11:46:27.790247"
      CI_DOCKER_FROM: "gcr.io/distroless/base-debian13:nonroot"
      CI_DOCKER_VERSION: "{\"Platform\": {\"Name\": \"Docker Engine - Community\"}, \"Components\": [{\"\
        Name\": \"Engine\", \"Version\": \"28.5.2\", \"Details\": {\"ApiVersion\": \"1.51\", \"Arch\"\
        : \"amd64\", \"BuildTime\": \"2025-11-05T14:43:25.000000000+00:00\", \"Experimental\": \"false\"\
        , \"GitCommit\": \"89c5e8f\", \"GoVersion\": \"go1.25.3\", \"KernelVersion\": \"6.12.58-cloudflare-2025.11.5\"\
        , \"MinAPIVersion\": \"1.24\", \"Os\": \"linux\"}}, {\"Name\": \"containerd\", \"Version\": \"\
        v2.1.5\", \"Details\": {\"GitCommit\": \"fcd43222d6b07379a4be9786bda52438f0dd16a1\"}}, {\"Name\"\
        : \"runc\", \"Version\": \"1.3.3\", \"Details\": {\"GitCommit\": \"v1.3.3-0-gd842d771\"}}, {\"\
        Name\": \"docker-init\", \"Version\": \"0.19.0\", \"Details\": {\"GitCommit\": \"de40ad0\"}}],\
        \ \"Version\": \"28.5.2\", \"ApiVersion\": \"1.51\", \"MinAPIVersion\": \"1.24\", \"GitCommit\"\
        : \"89c5e8f\", \"GoVersion\": \"go1.25.3\", \"Os\": \"linux\", \"Arch\": \"amd64\", \"KernelVersion\"\
        : \"6.12.58-cloudflare-2025.11.5\", \"BuildTime\": \"2025-11-05T14:43:25.000000000+00:00\"}"
      CI_GIT_COMMIT: "d7c62aed71e2aaccbe9230b9928f0e52a53f11c4"
      CI_GIT_REMOTE: "https://gitlab-ci-token:glcbt-64_Ag95vtQuV3BNYg-x95yP@gitlab.cfdata.org/cloudflare/tun/cloudflared.git"
      CI_TEAMCITY_BUILDCONF: ""
      CI_TEAMCITY_BUILD_NUMBER: ""
