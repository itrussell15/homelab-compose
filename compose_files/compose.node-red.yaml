services:
  mynodered:

    cap_drop:
      - "AUDIT_CONTROL"
      - "BLOCK_SUSPEND"
      - "DAC_READ_SEARCH"
      - "IPC_LOCK"
      - "IPC_OWNER"
      - "LEASE"
      - "LINUX_IMMUTABLE"
      - "MAC_ADMIN"
      - "MAC_OVERRIDE"
      - "NET_ADMIN"
      - "NET_BROADCAST"
      - "SYSLOG"
      - "SYS_ADMIN"
      - "SYS_BOOT"
      - "SYS_MODULE"
      - "SYS_NICE"
      - "SYS_PACCT"
      - "SYS_PTRACE"
      - "SYS_RAWIO"
      - "SYS_RESOURCE"
      - "SYS_TIME"
      - "SYS_TTY_CONFIG"
      - "WAKE_ALARM"

    container_name: "mynodered"

    entrypoint:
      - "./entrypoint.sh"

    environment:
      - "PATH=/usr/src/node-red/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      - "NODE_VERSION=20.20.0"
      - "YARN_VERSION=1.22.22"
      - "NODE_RED_VERSION=v4.1.4"
      - "NODE_PATH=/usr/src/node-red/node_modules:/data/node_modules"
      - "FLOWS=flows.json"
      - "TZ=America/Los_Angeles"

    hostname: "f65843ccc416"

    image: "nodered/node-red:latest"

    ipc: "private"

    labels:
      authors: "Dave Conway-Jones, Nick O'Leary, James Thomas, Raymond Mouthaan"
      org.label-schema.arch: ""
      org.label-schema.build-date: "2026-01-26T11:46:23Z"
      org.label-schema.description: "Low-code programming for event-driven applications."
      org.label-schema.docker.dockerfile: ".docker/Dockerfile.alpine"
      org.label-schema.license: "Apache-2.0"
      org.label-schema.name: "Node-RED"
      org.label-schema.url: "https://nodered.org"
      org.label-schema.vcs-ref: ""
      org.label-schema.vcs-type: "Git"
      org.label-schema.vcs-url: "https://github.com/node-red/node-red-docker"
      org.label-schema.version: "4.1.4"
      org.opencontainers.image.source: "https://github.com/node-red/node-red-docker"

    logging:
      driver: "json-file"
      options: {}

    network_mode: "bridge"

    ports:
      - "1880:1880/tcp"

    restart: "unless-stopped"

    stdin_open: true

    tty: true

    user: "node-red"

    volumes:
      - "node_red_data:/data"

    working_dir: "/usr/src/node-red"

version: "3.6"

volumes:
  node_red_data:
    external: true
